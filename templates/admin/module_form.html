{% extends 'base.html' %}
{% load static %}

{% block title %}{% if module %}Редактировать{% else %}Создать{% endif %} модуль{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        {% if module %}
                            <i class="bi bi-pencil me-2"></i>Редактировать модуль
                        {% else %}
                            <i class="bi bi-plus-circle me-2"></i>Создать модуль
                        {% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Название</label>
                            <input type="text" name="title" class="form-control" required
                                   value="{{ module.title|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea name="description" class="form-control" rows="4">{{ module.description|default:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Иконка (Bootstrap Icons, например: cpu, motherboard, memory)</label>
                            <input type="text" name="icon" class="form-control"
                                   value="{{ module.icon|default:'bi-cpu' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Порядковый номер</label>
                            <input type="number" name="order_number" class="form-control"
                                   value="{{ module.order_number|default:'0' }}" min="0">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-accent">
                                <i class="bi bi-check-lg me-1"></i>Сохранить
                            </button>
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
